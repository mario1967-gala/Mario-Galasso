{% extends "base.html" %}

{% block title %}Registro Voti{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Registro Voti</h2>
        <button class="btn btn-primary" onclick="showAddVotoModal()">+ Aggiungi Voto</button>
    </div>

    <div class="filters">
        <select id="filterClasse" onchange="updateStudenteFilter()">
            <option value="">Tutte le classi</option>
        </select>
        <select id="filterStudente" onchange="loadVoti()">
            <option value="">Tutti gli studenti</option>
        </select>
        <select id="filterMateria" onchange="loadVoti()">
            <option value="">Tutte le materie</option>
        </select>
    </div>

    <div id="voti-count" style="margin: 1rem 0; color: #666; font-size: 0.95rem;">
        <!-- Contatore voti -->
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Studente</th>
                    <th>Materia</th>
                    <th>Voto</th>
                    <th>Tipo</th>
                    <th>Note</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="voti-tbody">
                <tr>
                    <td colspan="7" class="text-center">Caricamento...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Aggiungi/Modifica Voto -->
<div id="votoModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Aggiungi Voto</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="votoForm" onsubmit="saveVoto(event)">
            <input type="hidden" id="votoId">

            <div class="form-group">
                <label for="studente_id">Studente *</label>
                <select id="studente_id" required>
                    <option value="">Seleziona studente</option>
                </select>
            </div>

            <div class="form-group">
                <label for="materia_id">Materia *</label>
                <select id="materia_id" required>
                    <option value="">Seleziona materia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="voto">Voto *</label>
                <input type="number" id="voto" min="1" max="10" step="0.25" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="scritto">Scritto</option>
                    <option value="orale">Orale</option>
                    <option value="pratico">Pratico</option>
                    <option value="progetto">Progetto</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data">Data *</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" rows="3"></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/voti.js') }}"></script>
{% endblock %}
