{% extends "base.html" %}

{% block title %}Gestione Studenti{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Gestione Studenti</h2>
        <div style="display: flex; gap: 1rem;">
            <a href="/studenti/import" class="btn btn-secondary">📷 Import da Screenshot</a>
            <button class="btn btn-primary" onclick="showAddStudentModal()">+ Aggiungi Studente</button>
        </div>
    </div>

    <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
        <div class="form-group" style="margin: 0; flex: 0 0 300px;">
            <label for="filtro-classe" style="margin-bottom: 0.5rem; display: block;">Filtra per Classe:</label>
            <select id="filtro-classe" onchange="filterByClasse()" style="width: 100%;">
                <option value="">Tutte le classi</option>
            </select>
        </div>
        <div id="studenti-count" style="color: #666; font-size: 0.95rem;">
            <!-- Il contatore verrà aggiornato qui -->
        </div>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Classe</th>
                    <th>Cognome</th>
                    <th>Nome</th>
                    <th>Data Nascita</th>
                    <th>Codice Fiscale</th>
                    <th>Email</th>
                    <th>Telefono</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="studenti-tbody">
                <tr>
                    <td colspan="8" class="text-center">Caricamento...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Aggiungi/Modifica Studente -->
<div id="studentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Aggiungi Studente</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="studentForm" onsubmit="saveStudent(event)">
            <input type="hidden" id="studentId">

            <div class="form-group">
                <label for="classe_id">Classe</label>
                <select id="classe_id">
                    <option value="">Seleziona classe...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label for="cognome">Cognome *</label>
                <input type="text" id="cognome" required>
            </div>

            <div class="form-group">
                <label for="data_nascita">Data di Nascita *</label>
                <input type="date" id="data_nascita" required>
            </div>

            <div class="form-group">
                <label for="codice_fiscale">Codice Fiscale</label>
                <input type="text" id="codice_fiscale" maxlength="16">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono">
            </div>

            <div class="form-group">
                <label for="indirizzo">Indirizzo</label>
                <textarea id="indirizzo" rows="3"></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/studenti.js') }}"></script>
{% endblock %}
