{% extends "base.html" %}

{% block title %}Gestione Classi{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h2>Gestione Classi</h2>
        <button onclick="openModal()" class="btn btn-primary">
            + Aggiungi Classe
        </button>
    </div>

    <div class="classi-grid" id="classi-container">
        <!-- Le classi verranno caricate qui -->
    </div>
</div>

<!-- Modal per aggiungere/modificare classe -->
<div id="classeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Aggiungi Classe</h3>

        <form id="classeForm">
            <input type="hidden" id="classe-id">

            <div class="form-row">
                <div class="form-group">
                    <label for="anno">Anno *</label>
                    <select id="anno" required>
                        <option value="">Seleziona...</option>
                        <option value="1">Primo</option>
                        <option value="2">Secondo</option>
                        <option value="3">Terzo</option>
                        <option value="4">Quarto</option>
                        <option value="5">Quinto</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sezione">Sezione *</label>
                    <input type="text" id="sezione" maxlength="10" placeholder="A, B, C..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="indirizzo">Indirizzo</label>
                <select id="indirizzo">
                    <option value="Scientifico">Scientifico</option>
                    <option value="Scientifico - Scienze Applicate">Scientifico - Scienze Applicate</option>
                    <option value="Classico">Classico</option>
                    <option value="Linguistico">Linguistico</option>
                    <option value="Artistico">Artistico</option>
                    <option value="Musicale">Musicale</option>
                    <option value="Altro">Altro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome">Nome Classe *</label>
                <input type="text" id="nome" placeholder="Es: 3A Scientifico" required>
                <small>Verrà generato automaticamente da Anno + Sezione + Indirizzo</small>
            </div>

            <div class="form-group">
                <label for="anno-scolastico">Anno Scolastico *</label>
                <input type="text" id="anno-scolastico" placeholder="Es: 2024/2025" required>
            </div>

            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" rows="3"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" onclick="closeModal()" class="btn btn-secondary">Annulla</button>
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal per visualizzare studenti della classe -->
<div id="studentiModal" class="modal">
    <div class="modal-content modal-large">
        <span class="close" onclick="closeStudentiModal()">&times;</span>
        <h3 id="studentiModalTitle">Studenti della Classe</h3>

        <div id="studenti-list">
            <!-- Lista studenti verrà caricata qui -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/classi.js') }}"></script>
{% endblock %}
